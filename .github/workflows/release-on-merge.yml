name: Create Release on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    outputs:
      skip: ${{ steps.extract_tag.outputs.skip }}
      release_tag: ${{ steps.extract_tag.outputs.tag }}
      branch_type: ${{ steps.extract_tag.outputs.branch_type }}
      merge_sha: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Extract and validate branch tag
        id: extract_tag
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -eu

          # Extract tag from PR head branch name (e.g., release/v1.2.3 or hotfix/v1.2.3 -> v1.2.3)
          HEAD_REF="$HEAD_REF"

          # Only process release and hotfix branches
          if ! [[ "$HEAD_REF" =~ ^(release|hotfix)/(.*)$ ]]; then
            echo "Not a release or hotfix branch, skipping release creation"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH_TYPE="${BASH_REMATCH[1]}"
          BRANCH_TAG="${BASH_REMATCH[2]}"

          if ! printf '%s' "$BRANCH_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version tag must follow semver format: vX.Y.Z"
            echo "Current tag: $BRANCH_TAG"
            exit 1
          fi

          echo "tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          echo "branch_type=$BRANCH_TYPE" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "✓ Valid branch: $HEAD_REF -> $BRANCH_TAG ($BRANCH_TYPE)"

      - name: Ensure release tag exists on merge commit
        if: steps.extract_tag.outputs.skip != 'true'
        id: ensure_tag
        env:
          RELEASE_TAG: ${{ steps.extract_tag.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          AUTH_TOKEN="$RELEASE_TOKEN"
          TOKEN_SOURCE="RELEASE_TOKEN"
          if [ -z "$AUTH_TOKEN" ]; then
            AUTH_TOKEN="$GITHUB_FALLBACK_TOKEN"
            TOKEN_SOURCE="GITHUB_TOKEN"
          fi

          if [ -z "$MERGE_SHA" ] || [ "$MERGE_SHA" = "null" ]; then
            echo "Missing merge commit SHA from pull_request event"
            exit 1
          fi

          REF_API="repos/${{ github.repository }}/git/ref/tags/$RELEASE_TAG"

          if GH_TOKEN="$AUTH_TOKEN" gh api "$REF_API" > /dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✓ Tag already exists: $RELEASE_TAG"
          else
            if GH_TOKEN="$AUTH_TOKEN" gh api \
              -X POST \
              "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$MERGE_SHA" > /dev/null 2>&1; then
              echo "created=true" >> "$GITHUB_OUTPUT"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "✓ Created tag $RELEASE_TAG at merge commit $MERGE_SHA"
            elif GH_TOKEN="$AUTH_TOKEN" gh api "$REF_API" > /dev/null 2>&1; then
              # Handle races from retries/concurrent reruns where tag appears after create attempt.
              echo "created=false" >> "$GITHUB_OUTPUT"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "✓ Tag exists after create attempt: $RELEASE_TAG"
            else
              echo "Failed to create release tag $RELEASE_TAG from merge commit $MERGE_SHA"
              echo "Token source: $TOKEN_SOURCE"
              echo "If repository rules restrict ref creation, configure a repo secret named RELEASE_TOKEN"
              exit 1
            fi
          fi

      - name: Generate release notes
        if: steps.extract_tag.outputs.skip != 'true' && steps.ensure_tag.outputs.ready == 'true'
        id: release_notes
        env:
          PR_BODY_RAW: ${{ github.event.pull_request.body }}
        run: |
          set -eu

          RELEASE_TAG="${{ steps.extract_tag.outputs.tag }}"
          BRANCH_TYPE="${{ steps.extract_tag.outputs.branch_type }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Keep PR body formatting intact and normalize CRLF to LF.
          PR_BODY="$(printf '%s' "$PR_BODY_RAW" | sed 's/\r$//')"

          # If PR body is empty, create a predictable markdown template.
          if [ -z "$PR_BODY" ] || [ "$PR_BODY" = "null" ]; then
            PR_BODY="$(printf '## Summary\nRelease %s published from a %s branch.\n\n## Source\n- Pull Request: #%s\n' "$RELEASE_TAG" "$BRANCH_TYPE" "$PR_NUMBER")"
          fi

          {
            echo "body<<EOF"
            printf '%s\n' "$PR_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Release notes prepared from PR description"

      - name: Delete previous hotfix/release images from GHCR
        if: steps.extract_tag.outputs.skip != 'true' && steps.ensure_tag.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e  # Continue on error
          PACKAGE_API_PREFIX="/orgs/${{ github.repository_owner }}/packages/container"

          RELEASE_TAG="${{ steps.extract_tag.outputs.tag }}"
          BRANCH_TYPE="${{ steps.extract_tag.outputs.branch_type }}"
          PREFIXED_TAG="$BRANCH_TYPE-$RELEASE_TAG"

          echo "Deleting previous images from GHCR..."

          # Function to delete all versions with a specific tag
          delete_tag_from_image() {
            local image_name=$1
            local tag=$2
            echo "Deleting $image_name:$tag..."

            gh api \
              -X GET \
              "$PACKAGE_API_PREFIX/$image_name/versions" \
              --paginate \
              --jq ".[] | select(.tags[]? == \"$tag\") | .id" | \
              while read version_id; do
                if [ -n "$version_id" ]; then
                  echo "  Deleting version $version_id"
                  gh api -X DELETE "$PACKAGE_API_PREFIX/$image_name/versions/$version_id" || true
                fi
              done
          }

          # Delete both version tag and prefixed tag for all images
          for image_name in respira-backend respira-frontend respira-proxy; do
            delete_tag_from_image "$image_name" "$RELEASE_TAG"
            delete_tag_from_image "$image_name" "$PREFIXED_TAG"
          done

          echo "Previous images deletion completed"
          set -e

      - name: Create GitHub Release
        if: steps.extract_tag.outputs.skip != 'true' && steps.ensure_tag.outputs.ready == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Release ${{ steps.extract_tag.outputs.tag }}
          tag_name: ${{ steps.extract_tag.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          body: ${{ steps.release_notes.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release creation summary
        if: steps.extract_tag.outputs.skip != 'true' && steps.ensure_tag.outputs.ready == 'true'
        run: |
          echo "✓ GitHub Release created"
          echo "  Tag: ${{ steps.extract_tag.outputs.tag }}"
          echo "  Branch Type: ${{ steps.extract_tag.outputs.branch_type }}"
          echo "  Release Type: Full Release"
          echo "  Tag Created: ${{ steps.ensure_tag.outputs.created }}"
          echo "  Merge Commit: ${{ github.event.pull_request.merge_commit_sha }}"
          echo "  PR: #${{ github.event.pull_request.number }}"
          echo ""
          echo "✓ Intermediate images deleted"
          echo "  Deleted: ${{ steps.extract_tag.outputs.branch_type }}-${{ steps.extract_tag.outputs.tag }}"
          echo "  From: respira-backend, respira-frontend, respira-proxy"

      # Image publishing needs the Production environment, whose branch policy
      # rejects this job's ephemeral refs/pull/<n>/merge ref; hand off release
      # metadata to release-publish.yml (workflow_run), which resolves to main.
      - name: Save release metadata for downstream publish workflow
        if: always()
        shell: bash
        run: |
          set -eu
          mkdir -p release-metadata
          {
            echo "SKIP=${{ steps.extract_tag.outputs.skip }}"
            echo "RELEASE_TAG=${{ steps.extract_tag.outputs.tag }}"
            echo "BRANCH_TYPE=${{ steps.extract_tag.outputs.branch_type }}"
          } > release-metadata/metadata.env

      - name: Upload release metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata/metadata.env
          retention-days: 1
