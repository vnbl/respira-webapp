name: Deploy to Production

run-name: Deploy Respira WebApp to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-remote-compose-webapp-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Production Django Migrations
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Ensure main branch dispatch
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "This workflow can only be executed from the main branch."
            echo "In GitHub Actions, set 'Use workflow from' to 'main'."
            exit 1
          fi

      - name: Check authorization
        shell: bash
        env:
          ALLOWED_USERS_PROD: ${{ vars.DEPLOY_ALLOWED_USERS_PROD }}
        run: |
          set -euo pipefail

          ALLOWED_USERS="$ALLOWED_USERS_PROD"

          if [ -z "$ALLOWED_USERS" ]; then
            echo "Error: DEPLOY_ALLOWED_USERS_PROD variable not configured"
            exit 1
          fi

          CURRENT_USER="${{ github.actor }}"
          if echo "$ALLOWED_USERS" | grep -qw "$CURRENT_USER"; then
            echo "✓ User $CURRENT_USER is authorized to deploy to production"
          else
            echo "✗ User $CURRENT_USER is NOT authorized to deploy to production"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve deployed release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          if ! printf '%s' "$release_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Latest GitHub Release tag must match vX.Y.Z; received '$release_tag'."
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        id: setup_ssh
        uses: ./.github/actions/prepare-ssh
        with:
          deploy_host: ${{ secrets.DEPLOY_HOST }}
          deploy_user: ${{ secrets.DEPLOY_USER }}
          deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy_host_key: ${{ secrets.DEPLOY_HOST_KEY }}
          environment_label: production

      - name: Prepare env file
        id: write_env
        uses: ./.github/actions/prepare-env
        with:
          env_file_b64: ${{ secrets.ENV_FILE_PROD }}
          environment_label: production
          env_secret_name: ENV_FILE_PROD
          env_file_suffix: env-prod
          required_keys: |
            BACKEND_SECRET_KEY

      - name: Validate dedicated migration DB credentials
        uses: ./.github/actions/validate-migration-credentials
        with:
          migration_db_user: ${{ secrets['BACKEND_POSTGRES_MIGRATION_USER'] }}
          migration_db_password: ${{ secrets['BACKEND_POSTGRES_MIGRATION_PASSWORD'] }}
          migration_db_name: ${{ secrets['BACKEND_POSTGRES_MIGRATION_DB'] }}
          migration_db_schema: ${{ secrets['BACKEND_POSTGRES_MIGRATION_SCHEMA'] }}
          migration_db_host: ${{ secrets['BACKEND_POSTGRES_MIGRATION_HOST'] }}
          migration_db_port: ${{ secrets['BACKEND_POSTGRES_MIGRATION_PORT'] || '5432' }}
          environment_label: production

      - name: Copy compose and env files to server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_WEBAPP }}
          KEY_PATH: ${{ steps.setup_ssh.outputs.key_path }}
          ENV_FILE: ${{ steps.write_env.outputs.env_file }}
        run: |
          set -euo pipefail

          echo "::group::Copy compose files to remote"

          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            docker-compose.yml \
            docker-compose.remote.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/"
          echo "::endgroup::"

          echo "::group::Copy immutable prod env file to remote"

          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$ENV_FILE" \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/.env.prod"
          echo "::endgroup::"

          echo "::group::Harden env file permissions on remote"
          ssh -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 600 '$COMPOSE_PATH/.env.prod'"
          echo "::endgroup::"

      - name: Run migrations over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_WEBAPP }}
          KEY_PATH: ${{ steps.setup_ssh.outputs.key_path }}
          MIGRATION_DB_USER: ${{ secrets['BACKEND_POSTGRES_MIGRATION_USER'] }}
          MIGRATION_DB_PASSWORD: ${{ secrets['BACKEND_POSTGRES_MIGRATION_PASSWORD'] }}
          MIGRATION_DB_NAME: ${{ secrets['BACKEND_POSTGRES_MIGRATION_DB'] }}
          MIGRATION_DB_SCHEMA: ${{ secrets['BACKEND_POSTGRES_MIGRATION_SCHEMA'] }}
          MIGRATION_DB_HOST: ${{ secrets['BACKEND_POSTGRES_MIGRATION_HOST'] }}
          MIGRATION_DB_PORT: ${{ secrets['BACKEND_POSTGRES_MIGRATION_PORT'] || '5432' }}
        run: |
          set -euo pipefail

          echo "::add-mask::$MIGRATION_DB_USER"
          echo "::add-mask::$MIGRATION_DB_PASSWORD"

          migration_user_b64="$(printf '%s' "$MIGRATION_DB_USER" | base64 | tr -d '\n')"
          migration_password_b64="$(printf '%s' "$MIGRATION_DB_PASSWORD" | base64 | tr -d '\n')"
          migration_db_name_b64="$(printf '%s' "$MIGRATION_DB_NAME" | base64 | tr -d '\n')"
          migration_db_schema_b64="$(printf '%s' "$MIGRATION_DB_SCHEMA" | base64 | tr -d '\n')"
          migration_db_host_b64="$(printf '%s' "$MIGRATION_DB_HOST" | base64 | tr -d '\n')"
          migration_db_port_b64="$(printf '%s' "$MIGRATION_DB_PORT" | base64 | tr -d '\n')"

          echo "::add-mask::$MIGRATION_DB_NAME"
          echo "::add-mask::$MIGRATION_DB_SCHEMA"
          echo "::add-mask::$MIGRATION_DB_HOST"
          echo "::add-mask::$MIGRATION_DB_PORT"

          migration_secrets_file=""
          cleanup_local_payload() {
            if [ -n "$migration_secrets_file" ]; then
              rm -f "$migration_secrets_file"
            fi
          }
          trap cleanup_local_payload EXIT

          migration_secrets_file="$RUNNER_TEMP/migration-db-secrets.env"
          {
            printf 'MIGRATION_DB_USER_B64=%s\n' "$migration_user_b64"
            printf 'MIGRATION_DB_PASSWORD_B64=%s\n' "$migration_password_b64"
            printf 'MIGRATION_DB_NAME_B64=%s\n' "$migration_db_name_b64"
            printf 'MIGRATION_DB_SCHEMA_B64=%s\n' "$migration_db_schema_b64"
            printf 'MIGRATION_DB_HOST_B64=%s\n' "$migration_db_host_b64"
            printf 'MIGRATION_DB_PORT_B64=%s\n' "$migration_db_port_b64"
          } > "$migration_secrets_file"
          chmod 600 "$migration_secrets_file"

          echo "::group::Upload temporary migration payload to remote"
          ssh -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -f '$COMPOSE_PATH/.migration-db-secrets.env'"

          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$migration_secrets_file" \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/.migration-db-secrets.env"
          echo "::endgroup::"

          echo "::group::Execute remote Django migrations"
          remote_migration_log="$RUNNER_TEMP/migration-remote.log"
          ssh -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "export COMPOSE_PATH='$COMPOSE_PATH'; bash -se" <<'REMOTE_SCRIPT' 2>&1 | tee "$remote_migration_log"
          set -euo pipefail

          compose_files="-f docker-compose.yml -f docker-compose.remote.yml"

          if [ -z "$COMPOSE_PATH" ] || [ ! -d "$COMPOSE_PATH" ]; then
            echo "Invalid DEPLOY_COMPOSE_PATH_WEBAPP configured for selected environment."
            exit 1
          fi

          secrets_file="$COMPOSE_PATH/.migration-db-secrets.env"
          if [ ! -f "$secrets_file" ]; then
            echo "Missing temporary migration secrets payload on remote host."
            exit 1
          fi
          chmod 600 "$secrets_file"
          trap 'rm -f "$secrets_file"' EXIT

          set -a
          . "$secrets_file"
          set +a

          migration_db_user="$(printf '%s' "$MIGRATION_DB_USER_B64" | base64 --decode)"
          migration_db_password="$(printf '%s' "$MIGRATION_DB_PASSWORD_B64" | base64 --decode)"
          migration_db_name="$(printf '%s' "$MIGRATION_DB_NAME_B64" | base64 --decode)"
          migration_db_schema="$(printf '%s' "$MIGRATION_DB_SCHEMA_B64" | base64 --decode)"
          migration_db_host="$(printf '%s' "$MIGRATION_DB_HOST_B64" | base64 --decode)"
          migration_db_port="$(printf '%s' "$MIGRATION_DB_PORT_B64" | base64 --decode)"

          # stdin is redirected from /dev/null so `docker compose run` cannot swallow the rest
          # of this heredoc script (which bash is reading from stdin).
          run_compose_migration() {
            BACKEND_POSTGRES_DB="$migration_db_name" \
            BACKEND_POSTGRES_USER="$migration_db_user" \
            BACKEND_POSTGRES_PASSWORD="$migration_db_password" \
            BACKEND_POSTGRES_HOST="$migration_db_host" \
            BACKEND_POSTGRES_PORT="$migration_db_port" \
            BACKEND_POSTGRES_SCHEMA="$migration_db_schema" \
            BACKEND_RUN_MIGRATIONS=false \
            docker compose \
              $compose_files \
              --env-file .env.prod \
              "$@" </dev/null
          }

          print_migration_diagnostics() {
            echo "Migration diagnostics: docker compose service status"
            run_compose_migration ps || true
            echo "Migration diagnostics: backend logs (last 120 lines)"
            run_compose_migration logs --tail=120 backend || true
          }

          on_migration_error() {
            exit_code=$?
            echo "Migration commands failed. Capturing diagnostics before exit."
            print_migration_diagnostics
            exit "$exit_code"
          }
          trap on_migration_error ERR

          cd "$COMPOSE_PATH"

          echo "[1/9] Pull backend image"
          run_compose_migration pull backend
          echo "[2/9] Database target used by the migration credentials"
          run_compose_migration run --rm -T --no-deps backend python manage.py shell -c "from django.db import connection; c = connection.cursor(); c.execute('select current_database(), current_user, current_schema(), current_setting(%s)', ['search_path']); print('migration connection ->', c.fetchone())"
          echo "[3/9] Applied migration state before changes"
          run_compose_migration run --rm -T --no-deps backend python manage.py showmigrations
          echo "[4/9] Show Django migration plan"
          run_compose_migration run --rm -T --no-deps backend python manage.py migrate --plan
          # Mirrors backend/entrypoint.sh: adopts the pre-existing dbt tables (regions, stations,
          # *_readings_gold, ...) instead of recreating them empty in the first search_path schema.
          echo "[5/9] Adopt pre-existing api tables"
          run_compose_migration run --rm -T --no-deps backend python manage.py migrate api --fake-initial --noinput
          echo "[6/9] Apply migrations"
          run_compose_migration run --rm -T --no-deps backend python manage.py migrate --noinput --verbosity 2
          echo "[7/9] Sync Django roles"
          run_compose_migration run --rm -T --no-deps backend python manage.py sync_roles
          echo "[8/9] Bootstrap Django superuser"
          run_compose_migration run --rm -T --no-deps backend python manage.py bootstrap_superuser
          echo "[9/9] Verify no unapplied migrations remain"
          run_compose_migration run --rm -T --no-deps backend python manage.py migrate --check --noinput

          echo "Django migrations completed successfully on production database."
          # Marker verified by the runner: proves the script reached the end instead of
          # dying quietly (e.g. stdin being consumed by a child process).
          echo "RESPIRA_MIGRATIONS_COMPLETE"
          REMOTE_SCRIPT

          if ! grep -q '^RESPIRA_MIGRATIONS_COMPLETE$' "$remote_migration_log"; then
            echo "::error::Remote migration script exited before completion; no completion marker found. See the log above for the last step reached."
            exit 1
          fi
          echo "::endgroup::"

  deploy:
    name: Deploy to Production
    needs: [migrate]
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Ensure main branch dispatch
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "This workflow can only be executed from the main branch."
            echo "In GitHub Actions, set 'Use workflow from' to 'main'."
            exit 1
          fi

      - name: Check authorization
        shell: bash
        env:
          ALLOWED_USERS_PROD: ${{ vars.DEPLOY_ALLOWED_USERS_PROD }}
        run: |
          set -euo pipefail

          ALLOWED_USERS="$ALLOWED_USERS_PROD"

          if [ -z "$ALLOWED_USERS" ]; then
            echo "Error: DEPLOY_ALLOWED_USERS_PROD variable not configured"
            exit 1
          fi

          CURRENT_USER="${{ github.actor }}"
          if echo "$ALLOWED_USERS" | grep -qw "$CURRENT_USER"; then
            echo "✓ User $CURRENT_USER is authorized to deploy to production"
          else
            echo "✗ User $CURRENT_USER is NOT authorized to deploy to production"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare SSH
        id: setup_ssh
        uses: ./.github/actions/prepare-ssh
        with:
          deploy_host: ${{ secrets.DEPLOY_HOST }}
          deploy_user: ${{ secrets.DEPLOY_USER }}
          deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy_host_key: ${{ secrets.DEPLOY_HOST_KEY }}
          environment_label: production

      - name: Prepare env file
        id: write_env
        uses: ./.github/actions/prepare-env
        with:
          env_file_b64: ${{ secrets.ENV_FILE_PROD }}
          environment_label: production
          env_secret_name: ENV_FILE_PROD
          env_file_suffix: env-prod
          required_keys: |
            BACKEND_SECRET_KEY
            BACKEND_POSTGRES_DB
            BACKEND_POSTGRES_USER
            BACKEND_POSTGRES_PASSWORD
            BACKEND_POSTGRES_HOST
            PUBLIC_REGION_DEFAULT_ID
            BACKEND_URL
            FRONTEND_PORT
            SITE_URL
            PUBLIC_GTAG
            CONTACT_MAIL
            TWITTER_HANDLE
            TELEGRAM_CHANNEL
            FACEBOOK_PAGE
            INSTAGRAM_HANDLE
            GITHUB_PATH
            SLACK_INVITE_PATH
            APP_STORE_PATH
            PLAY_STORE_APP_ID
            SMTP_KEY
            SMTP_SENDER
            SERVER_HOST
            CERT_NAME
            PROXY_PORT

      - name: Copy compose and env files to server
        id: copy_files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_WEBAPP }}
          KEY_PATH: ${{ steps.setup_ssh.outputs.key_path }}
          ENV_FILE: ${{ steps.write_env.outputs.env_file }}
        run: |
          set -euo pipefail

          echo "::group::Copy compose files to remote"
          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            docker-compose.yml \
            docker-compose.remote.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/"
          echo "::endgroup::"

          echo "::group::Copy immutable prod env file to remote"
          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$ENV_FILE" \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/.env.prod"
          echo "::endgroup::"

          echo "::group::Harden env file permissions on remote"
          ssh -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 600 '$COMPOSE_PATH/.env.prod'"
          echo "::endgroup::"

      - name: Deploy over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_WEBAPP }}
          KEY_PATH: ${{ steps.setup_ssh.outputs.key_path }}
          GLITCHTIP_RELEASE: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          echo "::group::Execute remote docker compose deploy"
          ssh -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "export COMPOSE_PATH='$COMPOSE_PATH' GLITCHTIP_RELEASE='$GLITCHTIP_RELEASE'; bash -se" <<'REMOTE_SCRIPT'
          set -euo pipefail

          compose_files="-f docker-compose.yml -f docker-compose.remote.yml"

          print_deploy_diagnostics() {
            echo "Deployment diagnostics: docker compose ps"
            docker compose $compose_files --env-file .env.prod ps || true
            echo "Deployment diagnostics: last 120 log lines per service"
            docker compose $compose_files --env-file .env.prod logs --tail=120 || true
          }

          fail_deploy_step() {
            step_name="$1"
            message="$2"

            echo "::error title=Deployment failed::$step_name"
            echo "$message"
            print_deploy_diagnostics
            exit 1
          }

          get_image_digest() {
            image_id="$1"
            docker image inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}none{{end}}' "$image_id"
          }

          capture_pulled_image_id() {
            service_name="$1"
            # docker compose config --images ignores the service-name filter and
            # lists every service's image, so filter explicitly by repository name.
            image_ref="$(docker compose $compose_files --env-file .env.prod config --images | grep -F "/respira-$service_name:" | head -n1)"

            if [ -z "$image_ref" ]; then
              fail_deploy_step "Resolve image reference for $service_name" "Failed to resolve the image reference for service $service_name."
            fi

            image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"

            if [ -z "$image_id" ]; then
              fail_deploy_step "Resolve pulled image for $service_name" "Failed to resolve the pulled image ID for service $service_name."
            fi

            echo "$image_id"
          }

          validate_running_image() {
            service_name="$1"
            expected_image_id="$2"

            container_id="$(docker compose $compose_files --env-file .env.prod ps -q "$service_name")"
            if [ -z "$container_id" ]; then
              fail_deploy_step "Validate $service_name image" "Service $service_name did not create a container."
            fi

            running_image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
            running_image_ref="$(docker inspect --format '{{.Config.Image}}' "$container_id")"
            expected_image_digest="$(get_image_digest "$expected_image_id")"
            running_image_digest="$(get_image_digest "$running_image_id")"

            echo "$service_name expected_image_id=$expected_image_id expected_digest=$expected_image_digest running_image_id=$running_image_id running_digest=$running_image_digest image_ref=$running_image_ref"

            if [ "$running_image_id" != "$expected_image_id" ]; then
              fail_deploy_step "Validate $service_name image" "Deployment validation failed for $service_name: running container image does not match the pulled image. Expected image ID: $expected_image_id; running image ID: $running_image_id; resolved image ref: $running_image_ref; expected digest: $expected_image_digest; running digest: $running_image_digest."
            fi

            if [ "$expected_image_digest" != "none" ] && [ "$running_image_digest" != "$expected_image_digest" ]; then
              fail_deploy_step "Validate $service_name image" "Deployment validation failed for $service_name: running image digest does not match the pulled image digest. Expected digest: $expected_image_digest; running digest: $running_image_digest; resolved image ref: $running_image_ref."
            fi
          }

          deploy_phase="Initializing deployment"

          on_deploy_error() {
            exit_code=$?
            echo "::error title=Deployment failed::$deploy_phase"
            echo "Remote deploy command failed during: $deploy_phase"
            print_deploy_diagnostics
            exit "$exit_code"
          }
          trap on_deploy_error ERR

          if [ -z "$COMPOSE_PATH" ] || [ ! -d "$COMPOSE_PATH" ]; then
            echo "Invalid DEPLOY_COMPOSE_PATH_WEBAPP configured for selected environment."
            exit 1
          fi

          cd "$COMPOSE_PATH"

          # Migrations are handled by the dedicated pre-deploy migration job.
          # Keep the decoded env file unchanged; enforce runtime override only.
          export BACKEND_RUN_MIGRATIONS=false

          deploy_phase="[1/3] Pull backend, frontend, and proxy images"
          echo "$deploy_phase"
          docker compose \
            $compose_files \
            --env-file .env.prod \
            pull backend frontend proxy

          backend_expected_image_id="$(capture_pulled_image_id backend)"
          frontend_expected_image_id="$(capture_pulled_image_id frontend)"
          proxy_expected_image_id="$(capture_pulled_image_id proxy)"

          deploy_phase="[2/3] Recreate the stack from the pulled images"
          echo "$deploy_phase"
          docker compose \
            $compose_files \
            --env-file .env.prod \
            up --force-recreate --remove-orphans --wait --wait-timeout 600 \
            backend frontend proxy

          deploy_phase="[3/3] Validate the running containers use the pulled images"
          echo "$deploy_phase"
          validate_running_image backend "$backend_expected_image_id"
          validate_running_image frontend "$frontend_expected_image_id"
          validate_running_image proxy "$proxy_expected_image_id"

          echo "Deployment image validation completed successfully."

          docker system prune -af
          docker image prune -af
          docker builder prune -af
          REMOTE_SCRIPT
          echo "::endgroup::"

      - name: Post-deploy summary
        run: |
          echo "Deployment of Respira WebApp to Production completed on remote server."
