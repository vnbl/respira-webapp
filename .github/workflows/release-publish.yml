name: Publish Release Images

run-name: Publish Release Images

# Triggered by workflow_run (not pull_request) so GITHUB_REF always resolves
# to the default branch, satisfying the Production environment's deployment
# branch policy; pull_request runs use the ephemeral refs/pull/<n>/merge ref,
# which can fail that same check even for a merged PR.
on:
  workflow_run:
    workflows: ["Create Release on Merge"]
    types: [completed]

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write
  actions: read

jobs:
  load-release-metadata:
    name: Load Release Metadata
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.metadata.outputs.skip }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      branch_type: ${{ steps.metadata.outputs.branch_type }}
    steps:
      # Downloaded to runner.temp, not the workspace, per GitHub's artifact
      # poisoning guidance: never let an untrusted artifact overwrite repo files.
      - name: Download release metadata
        id: download_metadata
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Never source (`.`) the downloaded file: its content is not trusted, and
      # sourcing would execute it as shell. Each value is instead extracted and
      # validated against a strict allow-pattern before becoming a step output.
      - name: Parse release metadata
        id: metadata
        if: always()
        shell: bash
        run: |
          set -eu

          METADATA_FILE="${{ runner.temp }}/release-metadata/metadata.env"
          SKIP=true
          RELEASE_TAG=""
          BRANCH_TYPE=""

          if [ -f "$METADATA_FILE" ]; then
            RAW_SKIP="$(grep -m1 -E '^SKIP=(true|false)$' "$METADATA_FILE" | cut -d= -f2 || true)"
            RAW_TAG="$(grep -m1 -E '^RELEASE_TAG=v[0-9]+\.[0-9]+\.[0-9]+$' "$METADATA_FILE" | cut -d= -f2 || true)"
            RAW_TYPE="$(grep -m1 -E '^BRANCH_TYPE=(release|hotfix)$' "$METADATA_FILE" | cut -d= -f2 || true)"

            if [ "$RAW_SKIP" = "false" ] && [ -n "$RAW_TAG" ] && [ -n "$RAW_TYPE" ]; then
              SKIP=false
              RELEASE_TAG="$RAW_TAG"
              BRANCH_TYPE="$RAW_TYPE"
            elif [ "$RAW_SKIP" = "true" ]; then
              echo "Upstream run marked this PR as not requiring a release; skipping publish."
            else
              echo "Release metadata missing or malformed; skipping publish."
            fi
          else
            echo "No release metadata artifact found; skipping publish."
          fi

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "branch_type=$BRANCH_TYPE" >> "$GITHUB_OUTPUT"


  publish-release-images:
    name: Publish Release Images to GHCR
    needs: load-release-metadata
    if: needs.load-release-metadata.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: Production
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      RELEASE_TAG: ${{ needs.load-release-metadata.outputs.release_tag }}

    steps:
      - name: Validate release tag format
        shell: bash
        run: |
          set -eu

          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag must match strict semver format: vX.Y.Z"
            exit 1
          fi

      - name: Normalize image owner
        id: normalize_owner
        shell: bash
        run: |
          echo "image_owner_lc=${IMAGE_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.load-release-metadata.outputs.release_tag }}
          fetch-depth: 0

      - name: Validate release tag is on main
        shell: bash
        run: |
          set -eu

          # Full fetch, not --depth=1: the checkout step above already
          # unshallowed history (fetch-depth: 0), and re-shallowing origin/main
          # here would give merge-base --is-ancestor false negatives once main
          # advances past the release tag's commit.
          git fetch origin main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag $RELEASE_TAG does not point to a commit contained in origin/main"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata backend
        id: meta_backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-backend
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Docker metadata frontend
        id: meta_frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-frontend
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Docker metadata proxy
        id: meta_proxy
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-proxy
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push backend image
        id: push_backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=release-publish-backend
          cache-to: type=gha,scope=release-publish-backend,mode=max,ignore-error=true
          provenance: true
          sbom: true

      - name: Build and push frontend image
        id: push_frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=release-publish-frontend
          cache-to: type=gha,scope=release-publish-frontend,mode=max,ignore-error=true
          provenance: true
          sbom: true

      - name: Upload frontend source maps
        if: vars.GLITCHTIP_UPLOAD_SOURCEMAPS == 'true'
        uses: ./.github/actions/upload-glitchtip-sourcemaps
        env:
          GLITCHTIP_UPLOAD_SOURCEMAPS: ${{ vars.GLITCHTIP_UPLOAD_SOURCEMAPS }}
          GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          GLITCHTIP_CLI_VERSION: ${{ vars.GLITCHTIP_CLI_VERSION }}
          GLITCHTIP_CLI_SHA256: ${{ vars.GLITCHTIP_CLI_SHA256 }}
          GLITCHTIP_URL: ${{ vars.GLITCHTIP_URL }}
          GLITCHTIP_ORG: ${{ vars.GLITCHTIP_ORG }}
          GLITCHTIP_PROJECT: ${{ vars.GLITCHTIP_FRONTEND_PROJECT }}
          GLITCHTIP_RELEASE: ${{ env.RELEASE_TAG }}

      - name: Build and push proxy image
        id: push_proxy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          push: true
          tags: ${{ steps.meta_proxy.outputs.tags }}
          labels: ${{ steps.meta_proxy.outputs.labels }}
          cache-from: type=gha,scope=release-publish-proxy
          cache-to: type=gha,scope=release-publish-proxy,mode=max,ignore-error=true
          provenance: true
          sbom: true

      - name: Generate backend image attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-backend
          subject-digest: ${{ steps.push_backend.outputs.digest }}
          push-to-registry: true

      - name: Generate frontend image attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-frontend
          subject-digest: ${{ steps.push_frontend.outputs.digest }}
          push-to-registry: true

      - name: Generate proxy image attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-proxy
          subject-digest: ${{ steps.push_proxy.outputs.digest }}
          push-to-registry: true
