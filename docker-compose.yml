services:
  backend:
    build: ./backend
    restart: always
    environment:
      # Core
      BACKEND_SECRET_KEY: ${BACKEND_SECRET_KEY}
      BACKEND_DEBUG: ${BACKEND_DEBUG:-false}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      BACKEND_RUN_MIGRATIONS: ${BACKEND_RUN_MIGRATIONS:-true}
      BACKEND_ALLOWED_HOSTS: ${BACKEND_ALLOWED_HOSTS:-}
      BACKEND_CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS:-}
      # Error monitoring (optional)
      BACKEND_GLITCHTIP_DSN: ${BACKEND_GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-}
      GLITCHTIP_RELEASE: ${GLITCHTIP_RELEASE:-}
      # Admin auth & sessions (optional; secure defaults follow BACKEND_DEBUG)
      BACKEND_SESSION_COOKIE_AGE: ${BACKEND_SESSION_COOKIE_AGE:-}
      BACKEND_SESSION_EXPIRE_AT_BROWSER_CLOSE: ${BACKEND_SESSION_EXPIRE_AT_BROWSER_CLOSE:-}
      BACKEND_SESSION_SAVE_EVERY_REQUEST: ${BACKEND_SESSION_SAVE_EVERY_REQUEST:-}
      BACKEND_SESSION_COOKIE_SECURE: ${BACKEND_SESSION_COOKIE_SECURE:-}
      BACKEND_CSRF_COOKIE_SECURE: ${BACKEND_CSRF_COOKIE_SECURE:-}
      BACKEND_SESSION_COOKIE_SAMESITE: ${BACKEND_SESSION_COOKIE_SAMESITE:-}
      BACKEND_CSRF_COOKIE_SAMESITE: ${BACKEND_CSRF_COOKIE_SAMESITE:-}
      BACKEND_CSRF_TRUSTED_ORIGINS: ${BACKEND_CSRF_TRUSTED_ORIGINS:-}
      # Admin default superuser bootstrap (created on deploy if both are set)
      BACKEND_SUPERUSER_EMAIL: ${BACKEND_SUPERUSER_EMAIL:-}
      BACKEND_SUPERUSER_PASSWORD: ${BACKEND_SUPERUSER_PASSWORD:-}
      # Security hardening (optional; production defaults follow BACKEND_DEBUG)
      BACKEND_AXES_ENABLED: ${BACKEND_AXES_ENABLED:-}
      BACKEND_AXES_FAILURE_LIMIT: ${BACKEND_AXES_FAILURE_LIMIT:-}
      BACKEND_AXES_COOLOFF_HOURS: ${BACKEND_AXES_COOLOFF_HOURS:-}
      BACKEND_PASSWORD_MIN_LENGTH: ${BACKEND_PASSWORD_MIN_LENGTH:-}
      BACKEND_PASSWORD_REQUIRE_SPECIAL: ${BACKEND_PASSWORD_REQUIRE_SPECIAL:-}
      BACKEND_SECURE_SSL_REDIRECT: ${BACKEND_SECURE_SSL_REDIRECT:-}
      BACKEND_SECURE_HSTS_SECONDS: ${BACKEND_SECURE_HSTS_SECONDS:-}
      BACKEND_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${BACKEND_SECURE_HSTS_INCLUDE_SUBDOMAINS:-}
      BACKEND_SECURE_HSTS_PRELOAD: ${BACKEND_SECURE_HSTS_PRELOAD:-}
      BACKEND_SECURE_PROXY_SSL_HEADER: ${BACKEND_SECURE_PROXY_SSL_HEADER:-}
      BACKEND_X_FRAME_OPTIONS: ${BACKEND_X_FRAME_OPTIONS:-}
      # Email / password reset (optional)
      BACKEND_EMAIL_BACKEND: ${BACKEND_EMAIL_BACKEND:-}
      BACKEND_EMAIL_HOST: ${BACKEND_EMAIL_HOST:-}
      BACKEND_EMAIL_PORT: ${BACKEND_EMAIL_PORT:-}
      BACKEND_EMAIL_HOST_USER: ${BACKEND_EMAIL_HOST_USER:-}
      BACKEND_EMAIL_HOST_PASSWORD: ${BACKEND_EMAIL_HOST_PASSWORD:-}
      BACKEND_EMAIL_USE_TLS: ${BACKEND_EMAIL_USE_TLS:-}
      BACKEND_DEFAULT_FROM_EMAIL: ${BACKEND_DEFAULT_FROM_EMAIL:-}
      # Database
      BACKEND_POSTGRES_DB: ${BACKEND_POSTGRES_DB}
      BACKEND_POSTGRES_USER: ${BACKEND_POSTGRES_USER}
      BACKEND_POSTGRES_PASSWORD: ${BACKEND_POSTGRES_PASSWORD}
      BACKEND_POSTGRES_HOST: ${BACKEND_POSTGRES_HOST}
      BACKEND_POSTGRES_PORT: ${BACKEND_POSTGRES_PORT:-5432}
      # Extra schemas appended to search_path after the fixed
      # django_admin, respira_gold, public prefix — see docs/backend-env-vars.md
      BACKEND_POSTGRES_SCHEMA: ${BACKEND_POSTGRES_SCHEMA:-}
      # Database SSL (optional)
      BACKEND_POSTGRES_SSLMODE: ${BACKEND_POSTGRES_SSLMODE:-}
      BACKEND_POSTGRES_SSLROOTCERT: ${BACKEND_POSTGRES_SSLROOTCERT:-}
      BACKEND_POSTGRES_SSLCERT: ${BACKEND_POSTGRES_SSLCERT:-}
      BACKEND_POSTGRES_SSLKEY: ${BACKEND_POSTGRES_SSLKEY:-}
      # Process (optional)
      BACKEND_APP_USER: ${BACKEND_APP_USER:-}
      BACKEND_APP_GROUP: ${BACKEND_APP_GROUP:-}
      # Gunicorn tuning (optional)
      BACKEND_GUNICORN_WORKERS: ${BACKEND_GUNICORN_WORKERS:-4}
      BACKEND_GUNICORN_TIMEOUT: ${BACKEND_GUNICORN_TIMEOUT:-30}
      BACKEND_GUNICORN_MAX_REQUESTS: ${BACKEND_GUNICORN_MAX_REQUESTS:-1000}
      BACKEND_GUNICORN_MAX_REQUESTS_JITTER: ${BACKEND_GUNICORN_MAX_REQUESTS_JITTER:-100}
      # Device followers & per-sensor push alerts (optional)
      BACKEND_DEVICE_FOLLOWER_THROTTLE: ${BACKEND_DEVICE_FOLLOWER_THROTTLE:-}
      BACKEND_MAX_FOLLOWS_PER_INSTALLATION: ${BACKEND_MAX_FOLLOWS_PER_INSTALLATION:-}
      BACKEND_SENSOR_ALERTS_ENABLED: ${BACKEND_SENSOR_ALERTS_ENABLED:-}
      # Model column overrides (optional)
      BACKEND_STATION_READINGS_DATE_COLUMN: ${BACKEND_STATION_READINGS_DATE_COLUMN:-}
      BACKEND_INFERENCE_RESULTS_6H_COLUMN: ${BACKEND_INFERENCE_RESULTS_6H_COLUMN:-}
      BACKEND_INFERENCE_RESULTS_12H_COLUMN: ${BACKEND_INFERENCE_RESULTS_12H_COLUMN:-}
    networks:
      - proxy_nw
    volumes:
      - static_volume:/static
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H 'X-Forwarded-Proto: https' http://localhost:${BACKEND_PORT:-8000}/api/health/ >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      PUBLIC_REGION_DEFAULT_ID: ${PUBLIC_REGION_DEFAULT_ID}
      PUBLIC_REGION_MAX_DISTANCE_KM: ${PUBLIC_REGION_MAX_DISTANCE_KM:-100}
      BACKEND_URL: ${BACKEND_URL}
      BACKEND_URL_INTERNAL: ${BACKEND_URL_INTERNAL:-}
      FRONTEND_PORT: ${FRONTEND_PORT}
      SITE_URL: ${SITE_URL}
      PUBLIC_GTAG: ${PUBLIC_GTAG}
      PUBLIC_GLITCHTIP_DSN: ${PUBLIC_GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-}
      GLITCHTIP_RELEASE: ${GLITCHTIP_RELEASE:-}
      CONTACT_MAIL: ${CONTACT_MAIL}
      TWITTER_HANDLE: ${TWITTER_HANDLE}
      TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL}
      FACEBOOK_PAGE: ${FACEBOOK_PAGE}
      INSTAGRAM_HANDLE: ${INSTAGRAM_HANDLE}
      GITHUB_PATH: ${GITHUB_PATH}
      SLACK_INVITE_PATH: ${SLACK_INVITE_PATH}
      APP_STORE_PATH: ${APP_STORE_PATH}
      PLAY_STORE_APP_ID: ${PLAY_STORE_APP_ID}
      SMTP_SENDER: ${SMTP_SENDER}
      SMTP_KEY: ${SMTP_KEY}
    networks:
      - frontend_nw
      - proxy_nw
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail http://localhost:${FRONTEND_PORT} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  proxy:
    build:
      context: ./proxy
      target: ${ENVIRONMENT:-local}
    restart: always
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT}
      CERT_NAME: ${CERT_NAME}
      FRONTEND_HOST: frontend
      FRONTEND_PORT: ${FRONTEND_PORT}
      PROXY_ADMIN_ALLOWED_IP_RANGES: ${PROXY_ADMIN_ALLOWED_IP_RANGES:-}
      PROXY_CSP_MODE: ${PROXY_CSP_MODE:-report-only}
      PROXY_CSP_SECURITY_ENDPOINT: ${PROXY_CSP_SECURITY_ENDPOINT:-}
      PROXY_CSP_GLITCHTIP_ORIGIN: ${PROXY_CSP_GLITCHTIP_ORIGIN:-}
      SERVER_HOST: ${SERVER_HOST}
    ports:
      - "${PROXY_PORT}:80"
      - 443:443
    networks:
      - proxy_nw
    volumes:
      - static_volume:/static
      - ${HOST_WORKSPACE_FOLDER:-.}/certbot/www:/var/www/certbot/
      - ${HOST_WORKSPACE_FOLDER:-.}/certbot/conf/:/etc/nginx/ssl/:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  static_volume:

networks:
  proxy_nw:
  frontend_nw:
